# Jobs: players pick jobs, earn money and levels for doing them, and earn more as they level.
# Money is paid through the core economy.

max-jobs: 2
max-level: 100
# Extra pay per job level (0.02 = +2% per level, so level 50 pays double).
pay-bonus-per-level: 0.02
# XP a player gets per 1.00 of money earned from an action.
xp-per-money: 8
# Players cannot earn more than this per real day from jobs. 0 turns the cap off.
daily-income-cap: 25000
# Ores and logs placed by players pay nothing when broken (stops place-and-break farming).
track-placed-blocks: true
# Mobs from spawners and spawn eggs pay nothing.
ignore-spawner-mobs: true

# In every list below a key starting with * matches by ending, for example *_LOG matches OAK_LOG.
jobs:
  miner:
    name: "&bMiner"
    description: "Earn money breaking ores and stone."
