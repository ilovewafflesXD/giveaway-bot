    description: Report a player to staff.
  reports:
    description: View open player reports.
  staff:
    description: List online staff.
  gmc:
    description: Creative mode.
  gms:
    description: Survival mode.
  gmsp:
    description: Spectator mode.
  gma:
    description: Adventure mode.
  invincible:
    description: Toggle invincibility.
